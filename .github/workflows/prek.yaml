# Lint baseline: run every prek hook on every push and pull request.
# lintr is skipped here (CI has no R); lint.yaml runs it with the package installed.
name: prek

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Hooks whose tools CI doesn't install (R, Lean, Lua, macOS, OpenTofu, shells, Node
      # projects); they run locally. A repo that needs one in CI adds a setup step and drops it
      # from this list.
      SKIP: no-commit-to-branch,lintr,lake-build,luacheck,plutil,claude-plugin-validate,zsh-syntax,fish-syntax,fish-indent,typstyle,tofu-fmt,tflint,trivy-config,tsc,eslint-astro
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        with:
          extra-args: --all-files
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d  # v3.1.0
        with:
          extra-args: --all-files --hook-stage pre-push
