# Lint baseline: the hooks every repo gets, run by prek (a faster drop-in for pre-commit).
#   prek install                  # once per clone; installs the pre-commit and pre-push hooks
#   prek run --all-files          # what `just lint` runs
#   prek auto-update              # bump the pinned revs
#
# Language hooks live in hooks/<language>.yaml in the template. Add one when the project is ready
# for it (it passes `lint-audit` for that language), by appending it below:
#   sed '1,/^repos:/d' hooks/python.yaml >> .pre-commit-config.yaml
# Formatters rewrite files and fail the commit; restage and commit again. Linters only report.
#
# Source: jrnold-projects lint-baseline/templates/. Change it there, not per repo.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

# ggthemes: also skip testthat snapshots and vdiffr baselines (rewriting them breaks the
# snapshot tests), roxygen's man/ pages (regenerated by devtools::document()) and README.md
# (knitted from README.Rmd).
exclude: |
  (?x)^(
    .*/(_freeze|_site|node_modules|\.venv|renv|\.lake)/.*
    |.*\.(csv|tsv|parquet|npz|geojson|native|nfm|rm)
    |tests/testthat/_snaps/.*
    |man/.*
    |README\.md
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]  # newly added files only; bigger files go in DVC or git-lfs
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
        exclude: (^|/)(tsconfig[^/]*|\.vscode/[^/]*|devcontainer)\.json$  # JSONC
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch  # work on a branch; main moves by fast-forward only
        args: [--branch, main, --branch, master]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md, --markdown-linebreak-ext=qmd]

  - repo: local
    hooks:
      - id: forbid-env-files
        name: forbid .env files (commit a .env.example instead)
        entry: .env files hold secrets
        language: fail
        files: (^|/)\.env(\.[^/]*)?$
        exclude: \.(example|sample|template)$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude]  # report only; `typos -w` fixes

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt  # reads indent and style from .editorconfig

  - repo: local
    hooks:
      - id: zsh-syntax
        name: zsh -n
        entry: zsh -n
        language: system
        types: [zsh]
      - id: fish-syntax
        name: fish --no-execute
        entry: fish --no-execute
        language: system
        types: [fish]
      - id: fish-indent
        name: fish_indent
        entry: fish_indent --check
        language: system
        types: [fish]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--persona=pedantic]

  - repo: local
    hooks:
      - id: panache-format
        name: panache format (Quarto, R Markdown, Markdown)
        entry: panache format
        language: python
        additional_dependencies: [panache-cli==3.17.0]
        files: \.(qmd|Rmd|md)$
        # ggthemes: R Markdown keeps knitr's chunk headers (```{r label, fig.width = 7}); panache
        # would rewrite every one as Quarto #| options. panache-lint still checks .Rmd.
        exclude: \.Rmd$
      - id: panache-lint
        name: panache lint
        entry: panache lint
        language: python
        additional_dependencies: [panache-cli==3.17.0]
        files: \.(qmd|Rmd|md)$
