# The Economist chart colours.
#
# `fg` and `bg` are the classic, pre-2017 Economist chart colours used by
# theme_economist(), theme_economist_white() and economist_pal(). They are
# kept exactly as ggthemes shipped them before 7.0.0, including the two
# repeated names ("light blue", "light green"): the palette looks colours up
# by name, so it has always used the first of each, and code that reads these
# tables directly sees the same rows it always did.
#
# `scales` are the "equal lightness colour scales" from "The Economist visual
# styleguide", version 1.2 (4 May 2017), p.12: six ordered steps per hue,
# darkest first, used by economist_seq_pal(), economist_gradient_pal() and the
# scale_*_economist_c() / scale_*_economist_ordinal() scales. See
# data-raw/reference/economist/SOURCES.md.

# Backgrounds.
bg:
- {name: "blue-gray", value: '#d5e4eb'}
- {name: "dark blue-gray", value: '#c3d6df'}
- {name: "red", value: '#ed111a'}
- {name: "light gray", value: '#ebebeb'}
- {name: "dark gray", value: '#c9c9c9'}
# Added after the five above, which stay in their old rows. The 2015-18 charts
# that drew their panels lighter than the ground: a deep ground and a pale
# panel. The commonest such pair in the chart corpus, which holds about ten of
# them, is ground #B8D0DC and panel #CDDEE7.
- {name: "deep blue-gray", value: '#b8d0dc'}
- {name: "pale blue-gray", value: '#cddee7'}

# Series colours.
fg:
- {name: "blue-gray", value: '#6794a7'}
- {name: "dark blue", value: '#014d64'}
- {name: "light green", value: '#76c0c1'}
- {name: "blue", value: '#01a2d9'}
- {name: "light blue", value: '#7ad2f6'}
- {name: "dark green", value: '#00887d'}
- {name: "gray", value: '#adadad'}
- {name: "light blue", value: '#7bd3f6'}
- {name: "dark red", value: '#7c260b'}
- {name: "pink", value: '#ee8f71'}
- {name: "light green", value: '#76c0c1'}
- {name: "brown", value: '#a18376'}

# "Equal lightness colour scales" (2017 styleguide, p.12): six ordered steps
# per hue, darkest first.
scales:
  red: ['#a81829', '#c7303c', '#e64e53', '#ff6b6c', '#ff8785', '#ffa39f']
  blue: ['#00588d', '#1270a8', '#3d89c3', '#5da4df', '#7bbffc', '#98daff']
  cyan: ['#005f73', '#00788d', '#0092a7', '#25adc2', '#4ec8de', '#6fe4fb']
  green: ['#005f52', '#00786b', '#2e9284', '#4dad9e', '#69c9b9', '#86e5d4']
  yellow: ['#714c00', '#8d6300', '#aa7c00', '#c89608', '#e7b030', '#ffcb4d']
  olive: ['#4c5900', '#667100', '#818a00', '#9da521', '#bac03f', '#d7db5a']
  purple: ['#78405f', '#925977', '#ad7291', '#c98cac', '#e6a6c7', '#ffc2e3']
  gold: ['#674e1f', '#826636', '#9d7f4e', '#b99966', '#d5b480', '#f2cf9a']
  gray: ['#3f5661', '#576e79', '#6f8793', '#89a2ae', '#a4bdc9', '#bfd8e5']
