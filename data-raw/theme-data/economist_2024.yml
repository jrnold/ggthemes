# Reverse-engineered from standard Economist graphics published after the
# March 2024 redesign. Values below are sampled from the local chart corpus,
# not carried over from the package's earlier experimental implementation.
#
# The six-colour qualitative order is stable across the clearest six-series
# examples: red, salmon, blue, light blue, dark grey, light grey. Print and
# web use distinct production values. The web set recurs in about 420 web
# charts from April 2024 to August 2026; the print set beyond red and salmon
# rests mainly on one 2026 chart (20260829_FNC090), and 2024 print blues vary.
#
# `single` is the brighter red of plain single-series bars, columns and lines.
# It rarely shares a chart with `accent`, the emphasis red of multi-series and
# annotated charts (3 of 94 print charts).
#
# The ramps are reconstructions, not sampled house ramps. The web red ramp
# comes from one map (20260801_WOM946). The print grey steps lie on the blend
# between text ink and ground, so they are anti-aliased text, used here only
# as plausible warm-grey steps. ggplot2 interpolates between stops.
#
# All of these palettes are provisional: update them when a better corpus of
# examples is available.
print:
  bg:
  - {name: "panel", value: '#ECEBE0'}
  - {name: "panel alternate", value: '#F3F1E6'}
  qualitative:
  - {name: "red", value: '#ED1C24'}
  - {name: "salmon", value: '#F8AB90'}
  - {name: "blue", value: '#28479D'}
  - {name: "light blue", value: '#659BD2'}
  - {name: "dark gray", value: '#636466'}
  - {name: "light gray", value: '#C6C8CA'}
  sequential_red:
  - {name: "red 0", value: '#F3F1E6'}
  - {name: "red 1", value: '#F0D3C1'}
  - {name: "red 2", value: '#F8AB90'}
  - {name: "red 3", value: '#F04F38'}
  - {name: "red 4", value: '#ED1C24'}
  sequential_gray:
  - {name: "gray 0", value: '#F3F1E6'}
  - {name: "gray 1", value: '#D8D6C8'}
  - {name: "gray 2", value: '#ABABA4'}
  - {name: "gray 3", value: '#7A7A75'}
  - {name: "gray 4", value: '#4B4946'}
  - {name: "gray 5", value: '#24211E'}
  diverging:
  - {name: "gray 3", value: '#24211E'}
  - {name: "gray 2", value: '#7A7A75'}
  - {name: "gray 1", value: '#D8D6C8'}
  - {name: "neutral", value: '#F3F1E6'}
  - {name: "red 1", value: '#F0D3C1'}
  - {name: "red 2", value: '#F04F38'}
  - {name: "red 3", value: '#ED1C24'}
  accent: '#ED1C24'
  single: '#F04F38'
  # Print specs: the simplest CMYK build that reproduces each observed print
  # colour through U.S. Web Coated (SWOP) v2, and its rendering. The print
  # values are SWOP renderings of their own CMYK builds, not ICC conversions
  # of the web values. See data-raw/economist_2024_swop.R.
  palette:
  - {name: "red", role: "series", cmyk: "0/100/100/0", hex: '#ED1C24', observed: '#ED1C24', delta_e: 0.0, confidence: "high"}
  - {name: "single red", role: "series", cmyk: "0/85/85/0", hex: '#F04E37', observed: '#F04F38', delta_e: 0.2, confidence: "high"}
  - {name: "salmon", role: "series", cmyk: "0/40/40/0", hex: '#F9AA8F', observed: '#F8AB90', delta_e: 0.4, confidence: "high"}
  - {name: "blue", role: "series", cmyk: "95/85/0/0", hex: '#2C479E', observed: '#28479D', delta_e: 0.6, confidence: "medium"}
  - {name: "light blue", role: "series", cmyk: "60/30/0/0", hex: '#659AD2', observed: '#659BD2', delta_e: 0.4, confidence: "high"}
  - {name: "dark gray", role: "series", cmyk: "0/0/0/75", hex: '#636466', observed: '#636466', delta_e: 0.0, confidence: "high"}
  - {name: "light gray", role: "series", cmyk: "0/0/0/25", hex: '#C7C8CA', observed: '#C6C8CA', delta_e: 0.5, confidence: "high"}
  - {name: "panel", role: "ground", cmyk: "0/0/6/8", hex: '#ECEBDF', observed: '#ECEBE0', delta_e: 0.4, confidence: "medium"}
  - {name: "panel alternate", role: "ground", cmyk: "4/3/9/0", hex: '#F2F0E5', observed: '#F3F1E6', delta_e: 0.2, confidence: "medium"}
  - {name: "text", role: "text", cmyk: "50/45/50/85", hex: '#22211D', observed: '#24211E', delta_e: 1.8, confidence: "low"}
  grid: '#CCCCC3'
  text: '#24211E'
  source: '#636466'
