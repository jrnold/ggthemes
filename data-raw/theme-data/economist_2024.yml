  - {name: "light blue", value: '#7892C5'}
  - {name: "dark gray", value: '#6A6654'}
  - {name: "light gray", value: '#BEBCAB'}
  sequential_red:
  - {name: "red 0", value: '#FFF5F0'}
  - {name: "red 1", value: '#FEE5D9'}
  - {name: "red 2", value: '#FDCCB8'}
  - {name: "red 3", value: '#FCAE93'}
  - {name: "red 4", value: '#FC8B6C'}
  - {name: "red 5", value: '#FA6547'}
  - {name: "red 6", value: '#F34935'}
  - {name: "red 7", value: '#D72522'}
  - {name: "red 8", value: '#B01117'}
  - {name: "red 9", value: '#71030F'}
  sequential_gray:
  - {name: "gray 0", value: '#F2F2F2'}
  - {name: "gray 1", value: '#D9D9D9'}
  - {name: "gray 2", value: '#B3B3B3'}
  - {name: "gray 3", value: '#868686'}
  - {name: "gray 4", value: '#666666'}
  - {name: "gray 5", value: '#4D4D4D'}
