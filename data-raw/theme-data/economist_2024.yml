# Reverse-engineered from standard Economist graphics published after the
# March 2024 redesign. Values below are sampled from the local chart corpus,
# not carried over from the package's earlier experimental implementation.
#
# The six-colour qualitative order is stable across the clearest six-series
# examples: red, salmon, blue, light blue, dark grey, light grey. Print and
# web use distinct production values. Sequential and diverging ramps are
# reduced to perceptually useful stops sampled from maps, heatmaps and shaded
# bands; ggplot2 interpolates between them for continuous data.
print:
  bg:
  - {name: "panel", value: '#ECEBE0'}
  - {name: "panel alternate", value: '#F3F1E6'}
  qualitative:
  - {name: "red", value: '#ED1C24'}
  - {name: "salmon", value: '#F8AB90'}
  - {name: "blue", value: '#28479D'}
  - {name: "light blue", value: '#659BD2'}
  - {name: "dark gray", value: '#636466'}
  - {name: "light gray", value: '#C6C8CA'}
  sequential_red:
  - {name: "red 0", value: '#F3F1E6'}
  - {name: "red 1", value: '#F0D3C1'}
  - {name: "red 2", value: '#F8AB90'}
  - {name: "red 3", value: '#F04F38'}
  - {name: "red 4", value: '#ED1C24'}
  - {name: "red 5", value: '#8E0D15'}
  sequential_gray:
  - {name: "gray 0", value: '#F3F1E6'}
  - {name: "gray 1", value: '#D8D6C8'}
  - {name: "gray 2", value: '#ABABA4'}
  - {name: "gray 3", value: '#7A7A75'}
  - {name: "gray 4", value: '#4B4946'}
  - {name: "gray 5", value: '#24211E'}
  diverging:
  - {name: "gray 3", value: '#24211E'}
  - {name: "gray 2", value: '#7A7A75'}
  - {name: "gray 1", value: '#D8D6C8'}
  - {name: "neutral", value: '#F3F1E6'}
  - {name: "red 1", value: '#F0D3C1'}
  - {name: "red 2", value: '#F04F38'}
  - {name: "red 3", value: '#ED1C24'}
  accent: '#ED1C24'
  grid: '#CCCCC3'
  text: '#24211E'
  source: '#636466'
web:
  bg:
  - {name: "panel", value: '#FFFFFF'}
  - {name: "panel alternate", value: '#F5F4EF'}
  qualitative:
