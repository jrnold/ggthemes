# Highcharts' own palette, tested for colour blindness and tailored to 3:1
# contrast against a white (light) or near-black (dark) background. Upstream writes
# position 2 in CSS three-digit form (`#222`), expanded here to `#222222`
# because R's colour parsing only accepts #RRGGBB / #RRGGBBAA.
"high_contrast_light":
- "#265FB5"
- "#222222"
- "#698F01"
- "#F4693E"
- "#4C0684"
- "#0FA388"
- "#B7104A"
- "#AF9023"
- "#1A704C"
- "#B02FDD"

"high_contrast_dark":
- "#67B9EE"
- "#CEEDA5"
- "#9F6AE1"
- "#FEA26E"
- "#6BA48F"
- "#EA3535"
- "#8D96B7"
- "#ECCA15"
- "#20AA09"
- "#E0C3E4"

# `avocado` and `sunset` have only four colours upstream.
"avocado":
- "#F3E796"
- "#95C471"
- "#35729E"
- "#251735"

"sunset":
- "#FDD089"
- "#FF7F79"
- "#A0446E"
- "#251535"
