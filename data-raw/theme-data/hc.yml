# Highcharts colour palettes.
#
# Sources (all verified against the npm tarball of highcharts 13.0.2):
# - `default` / `default_dark`: css/highcharts.css, `--highcharts-color-0`
#   through `--highcharts-color-9`. Since v12 the JS default is
#   `var(--highcharts-color-N)` rather than a literal hex, and two entries
#   differ under `light-dark()`, hence the separate dark variant.
# - `classic`: the literal `colors` array shipped in highcharts.src.js for
#   v5.0.0 through v10.x, replaced by the current default in v11.0.0.
# - every other palette: the `colors` array in the corresponding
#   themes/<name>.src.js.

# Highcharts >= 11 default, light mode.
"default":
- "#2caffe"
- "#544fc5"
- "#00e272"
- "#fe6a35"
- "#6b8abc"
- "#d568fb"
- "#2ee0ca"
- "#fa4b42"
- "#feb56a"
- "#91e8e1"

# Highcharts >= 11 default, dark mode. Identical to `default` apart from
# positions 2 and 3, which `light-dark()` swaps for legibility on a dark
# background.
"default_dark":
- "#2caffe"
- "#00e272"
- "#efdf00"
- "#fe6a35"
- "#6b8abc"
- "#d568fb"
- "#2ee0ca"
- "#fa4b42"
- "#feb56a"
- "#91e8e1"

