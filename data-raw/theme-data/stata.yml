# Stata graph scheme data.
#
# Colors, palettes and schemes are transcribed from Stata's own scheme
# files (ado/base/s/scheme-*.scheme) and the [G-4] colorstyle and
# [G-4] Scheme st manual entries.
#
# Two generations of colors appear below:
#   * the classic named colors and the gs0-gs16 gray scale, used by the
#     s1/s2/sj scheme families (Stata's default through Stata 17);
#   * stc1-stc15 plus the stblue/stgreen/stred/styellow aliases,
#     introduced in Stata 18 for the st family (the default since).
#     StataCorp documents these names but publishes no values; the hex
#     values here come from Ben Jann's ColrSpace named-color library,
#     <https://github.com/benjann/colrspace>.
